<style>
:root{--bg:#eef4fc;--card:#fff;--ink:#14233d;--mut:#6b7f9e;--acc:#2f6bff;--acc2:#12b5e5;--ok:#12a36b;--bad:#e5484d;--key:#e2ecfa;--line:#cfdcef;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2a4a;--card:#233763;--ink:#eef4ff;--mut:#a9bbdb;--acc:#6aa8ff;--acc2:#3fd0f5;--ok:#3fe0a5;--bad:#ff7b80;--key:#30487c;--line:#405992;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a2a4a;--card:#233763;--ink:#eef4ff;--mut:#a9bbdb;--acc:#6aa8ff;--acc2:#3fd0f5;--ok:#3fe0a5;--bad:#ff7b80;--key:#30487c;--line:#405992;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100%}
body.ar .tx,body.ar .side{font-family:'Cairo','Inter',system-ui,sans-serif}
.wrap{padding:20px 16px 40px}
.layout{display:grid;gap:16px;max-width:760px;margin:0 auto;grid-template-columns:1fr 1fr;grid-template-areas:"head head" "kb kb" "stage stage" "lh rh"}
.layout>.card{margin:0}
#hd{grid-area:head;min-width:0}
#kbcard{grid-area:kb;min-width:0}
#stage{grid-area:stage;min-width:0}
#lh{grid-area:lh}#rh{grid-area:rh}
.side{text-align:center}
@media(min-width:1240px){.layout{max-width:1400px;grid-template-columns:230px minmax(0,860px) 230px;grid-template-areas:"head head head" "lh kb rh" ". stage .";justify-content:center;align-items:center}}
.side-t{font-weight:900;font-size:16px;margin-bottom:8px}
.hand{width:100%;max-width:190px}
.hand .palm,.hand .th{fill:var(--key);stroke:var(--line);stroke-width:1.5}
.fg{fill:var(--c);opacity:.4;stroke:var(--line);stroke-width:1.2;transition:opacity .15s}
.fg.act{opacity:1;filter:drop-shadow(0 0 7px var(--c))}
h1{font-size:28px;font-weight:900;margin:8px 0 16px;text-align:center}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;justify-content:center;direction:ltr}
.tab{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 22px;border-radius:99px;cursor:pointer}
.tab.ar{font-family:'Cairo',sans-serif}
.tab.on{background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 30px rgba(47,107,255,.10)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.head b{font-size:17px}
.count{background:var(--key);color:var(--acc);padding:3px 12px;border-radius:99px;font-weight:700;font-size:14px}
.btns{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.kb{direction:ltr;display:flex;flex-direction:column;align-items:center;gap:6px}
.row{display:flex;gap:6px;justify-content:center;width:100%}
.row:nth-child(2){padding:0 2%}.row:nth-child(3){padding:0 4%}.row:nth-child(4){padding:0 8%}.row:nth-child(5){padding:0 20%}
@media(max-width:600px){.kb,.row{gap:3px}}
.k{position:relative;flex:1;max-width:54px;aspect-ratio:1/1.05;border-radius:10px;border:2px solid transparent;background:var(--key);color:var(--ink);font:inherit;font-weight:900;font-size:clamp(11px,3.4vw,20px);text-transform:uppercase;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset 0 -4px 0 var(--f,transparent)}
.k.ark{font-family:'Cairo',sans-serif;font-size:clamp(12px,3.8vw,22px)}
.k.wide{flex:1.9;max-width:110px;aspect-ratio:auto;font-size:clamp(10px,2.6vw,13px);text-transform:none}
.k.space{flex:1;max-width:380px;aspect-ratio:auto;height:clamp(38px,8vw,50px);font-size:clamp(11px,2.6vw,14px);text-transform:none}
.k:hover{transform:translateY(-2px)}
.k.on{background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff;box-shadow:inset 0 -4px 0 var(--f,transparent),0 6px 14px rgba(47,107,255,.35)}
.k.home::after{content:"";position:absolute;bottom:9px;width:12px;height:3px;border-radius:2px;background:currentColor;opacity:.5}
.k.hit{border-color:var(--ok)}
.k.next{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;background:var(--c)}
.stage{text-align:center;padding:26px 12px;position:relative}
#inp{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:text;font-size:16px}
.word{direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(34px,9vw,64px);font-weight:700;letter-spacing:.08em;min-height:1.4em;overflow-wrap:anywhere}
.word.ar{direction:rtl;font-family:'Cairo',sans-serif;letter-spacing:0}
.word span{color:var(--mut);transition:color .12s}
.word span.done{color:var(--ok)}
.word span.cur{color:var(--ink);border-bottom:4px solid var(--acc)}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stats{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.st{background:var(--key);border-radius:14px;padding:8px 16px;min-width:92px}
.st b{display:block;font-size:22px;font-weight:900;color:var(--acc)}
.st small{color:var(--mut);font-size:12px}
.empty{color:var(--mut);padding:30px 0;font-size:17px;font-family:inherit;direction:inherit}
</style>
</head>
<body>
<div class="wrap"><div class="layout">

  <div id="hd" class="tx">
    <h1 id="ttl"></h1>
    <div class="tabs">
      <button class="tab" id="t-en">English</button>
      <button class="tab ar" id="t-ar">العربية</button>
    </div>
  </div>

  <aside class="card side" id="lh">
    <div class="side-t" id="lh-t"></div>
    <div id="lh-svg"></div>
  </aside>

  <div class="card tx" id="kbcard">
    <div class="head">
      <div><b id="known"></b> <span class="count" id="count">0</span></div>
      <div class="btns"><button class="btn" id="all"></button><button class="btn" id="none"></button></div>
    </div>
    <div class="kb" id="kb"></div>
    <div class="legend" id="legend"></div>
  </div>

  <aside class="card side" id="rh">
    <div class="side-t" id="rh-t"></div>
    <div id="rh-svg"></div>
  </aside>

  <div class="card stage tx" id="stage">
    <div class="word" id="word"></div>
    <input id="inp" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type here">
    <div class="stats">
      <div class="st"><b id="sw">0</b><small id="lw"></small></div>
      <div class="st"><b id="sa">100%</b><small id="la"></small></div>
      <div class="st"><b id="ss">0</b><small id="ls"></small></div>
    </div>
  </div>

</div></div>

<script>
const EN_WORDS=[...new Set(("fur jar jug kid kit rug run fun fix fit fed far fat for due dry ear era key rub urn rude ride rink fire fork free fuel full furl jerk junk jump just kind king kick kiss keep kept lake lamp land last late lead leaf left lift like lion list live look luck make many mark mild milk mind mine miss moon more most move much name near need nice nine note nurse once only open over park part past pick pink plan play pull push quit race rain read real rice ring risk road rock room rule rush safe sand seed seek self sell send ship shirt shop show side sign silk sing skin slow snow soft some song soon sort star stay stop sure swim take talk tall task team tell test then thin this tide time tire tool tree true turn used very walk wall want warm wash wave week well what when wide wife wind wine wish with word work yard year zero zone and are but can did get had her him his its not our out she the was who you all any big boy cut day dog eat end few got has hit hot how let lot may new now off old one put red say see set sit sun ten too top try two use way win yes yet duke juke fern kerf turf surf drift flirt first fruit").split(" "))];
const AR_WORDS=[...new Set(("باب بيت ولد بنت كتاب قلم شمس قمر نجم بحر نهر جبل ورد شجر ماء خبز لبن عسل تمر رمل طير سمك قطة كلب فيل جمل حصان بقرة دجاج فرس سيف نور ليل صبح يوم عام شهر سنة وقت ساعة دقيقة كبير صغير جميل طويل قصير قوي ضعيف سريع بطيء جديد قديم حار بارد حلو مر سهل صعب مفتوح مغلق كثير قليل ثقيل خفيف نظيف واسع ضيق قريب بعيد عالي مدرسة معلم طالب درس سؤال جواب حرف كلمة جملة قصة شعر فن علم عمل لعب سفر رحلة طريق سيارة قطار طائرة سفينة مدينة قرية شارع ميدان حديقة مسجد سوق دكان محل بنك مصنع مزرعة غابة صحراء جزيرة وادي موج ريح مطر ثلج غيم سحاب برق رعد نار تراب حجر حديد فضة خشب ورق زجاج قماش حرير صوف قطن عين انف فم يد رجل قلب كبد دم جلد عظم سن لسان خد جبين كتف ظهر بطن صدر ركبة صديق اخ اخت ام اب جد جدة عم خال زوج زوجة طفل شيخ ملك امير وزير قاضي جندي طبيب مهندس نجار حداد خباز بائع تين ملك نيل سلم بلد تلك نسل شبك سكن سلة ملابس مكتب باسم كتب بنك لبنان سلام كلام نمل بسم سمن نبات ثمن حبل جلس ركب نزل وصل فتح قفل كسر بني شرب اكل نام قام جلب حمل ذهب ذكر مذاق").split(" "))];

const COMMON={Digit1:"1",Digit2:"2",Digit3:"3",Digit4:"4",Digit5:"5",Digit6:"6",Digit7:"7",Digit8:"8",Digit9:"9",Digit0:"0",Minus:"-",Equal:"=",Space:" ",Enter:"\n"};
const EN_MAP={...COMMON,Backquote:"`",BracketLeft:"[",BracketRight:"]",Semicolon:";",Quote:"'",Comma:",",Period:".",Slash:"/"};
"abcdefghijklmnopqrstuvwxyz".split("").forEach(c=>EN_MAP["Key"+c.toUpperCase()]=c);
const AR_MAP={...COMMON,Backquote:"ذ",KeyQ:"ض",KeyW:"ص",KeyE:"ث",KeyR:"ق",KeyT:"ف",KeyY:"غ",KeyU:"ع",KeyI:"ه",KeyO:"خ",KeyP:"ح",BracketLeft:"ج",BracketRight:"د",KeyA:"ش",KeyS:"س",KeyD:"ي",KeyF:"ب",KeyG:"ل",KeyH:"ا",KeyJ:"ت",KeyK:"ن",KeyL:"م",Semicolon:"ك",Quote:"ط",KeyZ:"ئ",KeyX:"ء",KeyC:"ؤ",KeyV:"ر",KeyN:"ى",KeyM:"ة",Comma:"و",Period:"ز",Slash:"ظ"};
const DIG=["Backquote","Digit1","Digit2","Digit3","Digit4","Digit5","Digit6","Digit7","Digit8","Digit9","Digit0","Minus","Equal"];
const LANGS={
  en:{map:EN_MAP,home:"fj",def:["f","j","u","r","k"],words:EN_WORDS,store:"learned",
    layout:[DIG,["KeyQ","KeyW","KeyE","KeyR","KeyT","KeyY","KeyU","KeyI","KeyO","KeyP","BracketLeft","BracketRight"],["KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ","KeyK","KeyL","Semicolon","Quote","Enter"],["KeyZ","KeyX","KeyC","KeyV","KeyB","KeyN","KeyM","Comma","Period","Slash"],["Space"]]},
  ar:{map:AR_MAP,home:"بت",def:["ب","ت"],words:AR_WORDS,store:"learned_ar",
    layout:[DIG,["KeyQ","KeyW","KeyE","KeyR","KeyT","KeyY","KeyU","KeyI","KeyO","KeyP","BracketLeft","BracketRight"],["KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ","KeyK","KeyL","Semicolon","Quote","Enter"],["KeyZ","KeyX","KeyC","KeyV","KeyN","KeyM","Comma","Period","Slash"],["Space"]]}
};
Object.values(LANGS).forEach(L=>{L.rev={};Object.entries(L.map).forEach(([c,ch])=>L.rev[ch]=c)});
const T={
  en:{title:'Touch Typing <span>Practice</span>',known:"Keys I know",all:"All",clear:"Clear",words:"Words",acc:"Accuracy",streak:"Best streak",empty:"Mark at least one key",lh:"Left hand",rh:"Right hand",sp:"Space",en:"Enter",f:["Pinky","Ring","Middle","Index","Thumb"]},
  ar:{title:'تمرين <span>الكتابة باللمس</span>',known:"الأزرار اللي حفظتها",all:"الكل",clear:"مسح",words:"كلمات",acc:"الدقة",streak:"أطول سلسلة",empty:"علّم على زرار واحد على الأقل",lh:"اليد اليسرى",rh:"اليد اليمنى",sp:"مسافة",en:"إنتر",f:["الخنصر","البنصر","الوسطى","السبابة","الإبهام"]}
};
const FG={L5:["Backquote","Digit1","KeyQ","KeyA","KeyZ"],L4:["Digit2","KeyW","KeyS","KeyX"],L3:["Digit3","KeyE","KeyD","KeyC"],L2:["Digit4","Digit5","KeyR","KeyT","KeyF","KeyG","KeyV","KeyB"],R2:["Digit6","Digit7","KeyY","KeyU","KeyH","KeyJ","KeyN","KeyM"],R3:["Digit8","KeyI","KeyK","Comma"],R4:["Digit9","KeyO","KeyL","Period"],R5:["Digit0","Minus","Equal","KeyP","BracketLeft","BracketRight","Semicolon","Quote","Slash","Enter"],T:["Space"]};
const FCOL={5:"#f472b6",4:"#fb923c",3:"#eab308",2:"#22c55e",T:"#38bdf8"};
const fcol=f=>f==="T"?FCOL.T:FCOL[f[1]];
const F_OF={};Object.entries(FG).forEach(([f,cs])=>cs.forEach(c=>F_OF[c]=f));
let lang="en";try{const s=localStorage.getItem("lang");if(s&&LANGS[s])lang=s}catch(e){}
const L=()=>LANGS[lang];
const codeOf=ch=>L().rev[ch];
const kindOf=ch=>{const c=codeOf(ch);if(c==="Space")return"space";if(c==="Enter")return"enter";if(/^Digit[0-9]$/.test(c))return"digit";
  if(lang==="en")return c.startsWith("Key")?"letter":"punct";return(c==="Minus"||c==="Equal")?"punct":"letter"};
const disp=c=>c===" "?"␣":c==="\n"?"↵":c;

function handSVG(P){
  const fin=(n,cx,top,w,rot)=>`<rect class="fg" data-f="${P}${n}" style="--c:${FCOL[n]}" x="${cx-w/2}" y="${top}" width="${w}" height="${136-top}" rx="${w/2}" transform="rotate(${rot} ${cx} 136)"/>`;
  return `<svg viewBox="0 0 200 220" class="hand" aria-hidden="true"><g ${P==="R"?'transform="translate(200,0) scale(-1,1)"':""}>
  <rect class="fg" data-f="${P}1" style="--c:${FCOL.T}" x="150" y="120" width="30" height="66" rx="15" transform="rotate(50 165 152)"/>
  ${fin(5,38,66,26,-8)}${fin(4,73,38,29,-3)}${fin(3,108,28,30,0)}${fin(2,142,42,29,3)}
  <path class="palm" d="M28 132C28 120 36 115 46 115L152 115C163 115 169 123 169 135L165 160C161 178 150 190 140 196L134 216L78 216L72 196C56 188 38 176 32 158Z"/>
  </g></svg>`;
}
const $=id=>document.getElementById(id);
$("lh-svg").innerHTML=handSVG("L");$("rh-svg").innerHTML=handSVG("R");

function applyText(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.body.classList.toggle("ar",lang==="ar");
  document.querySelectorAll(".tx").forEach(e=>e.dir=lang==="ar"?"rtl":"ltr");
  $("ttl").innerHTML=t.title;$("known").textContent=t.known;
  $("all").textContent=t.all;$("none").textContent=t.clear;
  $("lw").textContent=t.words;$("la").textContent=t.acc;$("ls").textContent=t.streak;
  $("lh-t").textContent=t.lh;$("rh-t").textContent=t.rh;
  $("legend").innerHTML=["5","4","3","2","T"].map((n,i)=>`<span><i style="--c:${fcol("F"+n)}"></i>${t.f[i]}</span>`).join("");
}

const sets={};
const load=l=>{try{const s=localStorage.getItem(LANGS[l].store);if(s)return new Set(JSON.parse(s))}catch(e){}return new Set(LANGS[l].def)};
sets.en=load("en");sets.ar=load("ar");
let learned=sets[lang];
const save=()=>{try{localStorage.setItem(L().store,JSON.stringify([...learned]))}catch(e){}};

const kb=$("kb"),wordEl=$("word"),inp=$("inp");
let keyEls={};
function buildKb(){
  kb.innerHTML="";keyEls={};
  L().layout.forEach(r=>{const row=document.createElement("div");row.className="row";
    r.forEach(code=>{const c=L().map[code];const b=document.createElement("button");
      b.className="k"+(lang==="ar"?" ark":"")+(code==="Enter"?" wide":"")+(code==="Space"?" space":"")+(L().home.includes(c)?" home":"");
      b.textContent=code==="Space"?T[lang].sp:code==="Enter"?T[lang].en:c;
      const f=F_OF[code];if(f)b.style.setProperty("--f",fcol(f));
      b.onclick=()=>{learned.has(c)?learned.delete(c):learned.add(c);save();refresh(true);b.blur()};
      keyEls[c]=b;row.appendChild(b)});kb.appendChild(row)});
}
$("all").onclick=()=>{L().layout.flat().forEach(code=>learned.add(L().map[code]));save();refresh(true)};
$("none").onclick=()=>{learned.clear();save();refresh(true)};

function guide(ch){
  document.querySelectorAll(".k.next").forEach(k=>k.classList.remove("next"));
  if(!ch)return;
  if(keyEls[ch])keyEls[ch].classList.add("next");
  const f=F_OF[codeOf(ch)];
  document.querySelectorAll(".fg").forEach(e=>e.classList.toggle("act",e.dataset.f===f||(f==="T"&&/1$/.test(e.dataset.f))));
}

let word="",pos=0,total=0,hits=0,tries=0,streak=0,best=0,last="";
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function drill(chars,min=3,span=3){
  if(chars.length===1)return chars[0].repeat(3);
  const n=min+Math.floor(Math.random()*span);let s="";
  while(s.length<n){const c=rnd(chars);if(s.slice(-2)!==c+c)s+=c}
  return s;
}
function make(){
  const all=[...learned];if(!all.length)return"";
  const Ls=all.filter(c=>kindOf(c)==="letter"),Ds=all.filter(c=>kindOf(c)==="digit"),Ps=all.filter(c=>kindOf(c)==="punct");
  const sp=learned.has(" "),en=learned.has("\n");
  const pool=Ls.length?L().words.filter(w=>[...w].every(c=>learned.has(c))):[];
  const wordTok=()=>(pool.length>=6||(pool.length&&Math.random()<.7))?rnd(pool):drill(Ls);
  const numTok=()=>drill(Ds,2,3);
  const tok=()=>{
    const o=[];if(Ls.length)o.push(wordTok);if(Ds.length)o.push(numTok);
    let t=o.length?rnd(o)():"";
    if(Ps.length){if(!t)t=drill(Ps,2,2);else if(Math.random()<.6)t+=rnd(Ps)}
    return t;
  };
  const n=sp?(Math.random()<.6?2:1):1;
  let toks=[];for(let i=0;i<n;i++){const t=tok();if(t)toks.push(t)}
  let s=toks.join(sp?" ":"");
  if(en&&(!s||Math.random()<.5))s+="\n";
  if(!s)s=drill(all);
  return s;
}
function pick(){
  let w,i=0;
  do{w=make();i++}while(w===last&&i<20);
  last=w;return w;
}
function draw(){
  wordEl.innerHTML="";
  [...word].forEach((c,i)=>{const s=document.createElement("span");s.textContent=disp(c);
    s.className=i<pos?"done":i===pos?"cur":"";wordEl.appendChild(s)});
  guide(word[pos]);
}
function next(){
  if(learned.size<1){word="";wordEl.innerHTML='<div class="empty">'+T[lang].empty+'</div>';guide(null);document.querySelectorAll(".fg.act").forEach(e=>e.classList.remove("act"));return}
  word=pick();pos=0;draw();
}
function refresh(reset){
  Object.entries(keyEls).forEach(([c,b])=>b.classList.toggle("on",learned.has(c)));
  $("count").textContent=learned.size;
  if(reset)next();
}
function stats(){
  $("sw").textContent=total;
  $("sa").textContent=(tries?Math.round(hits/tries*100):100)+"%";
  $("ss").textContent=best;
}
function setLang(l){
  lang=l;learned=sets[l];
  try{localStorage.setItem("lang",l)}catch(e){}
  $("t-en").classList.toggle("on",l==="en");
  $("t-ar").classList.toggle("on",l==="ar");
  wordEl.classList.toggle("ar",l==="ar");
  total=hits=tries=streak=best=0;last="";
  applyText();buildKb();refresh(true);stats();
}
$("t-en").onclick=()=>setLang("en");
$("t-ar").onclick=()=>setLang("ar");

function press(k){
  if(!word)return;
  tries++;
  if(k===word[pos]){hits++;streak++;best=Math.max(best,streak);pos++;
    const el=keyEls[k];if(el){el.classList.add("hit");setTimeout(()=>el.classList.remove("hit"),150)}
    draw();
    if(pos===word.length){total++;stats();setTimeout(next,220)}
  }else{streak=0;wordEl.classList.remove("shake");void wordEl.offsetWidth;wordEl.classList.add("shake")}
  stats();
}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=L().map[e.code];
  if(k===undefined)return;
  e.preventDefault();press(k);
});
document.addEventListener("keyup",e=>{if(e.code==="Space"||e.code==="Enter")e.preventDefault()});
inp.addEventListener("input",()=>{const v=inp.value.toLowerCase();inp.value="";if(v)press(v.slice(-1))});
inp.focus();
setLang(lang);
</script>
</body>
</html>
